<!doctype html><meta charset="utf-8"><title>Comparaison GPU du lecteur ExpMap</title>
<button id="run">Comparer fenêtre circulaire et blocs</button><pre id="result">Test fonctionnel synthétique, sans benchmark.</pre>
<script type="module">
import {ShaderExpmapRenderer} from '/src/expmap/displayRenderer.ts'
import {planExpmap} from '/src/expmap/plan.ts'
import {planExpmapOctaves} from '/src/expmap/octaves.ts'
import {shaderBlockAt,shaderBlockCount,shaderSourceEstimate} from '/src/expmap/displayFormat.ts'
const code=`
override ENABLE_SURFACE_EFFECTS:bool=true;
struct Uniforms {aspect:f32,lnScale:f32,orbitMetricsEnabled:f32,reachDebug:f32,aaAnalytic:f32}
const baseParameters=Uniforms(1,0,1,0,0);var<private> parameters:Uniforms;
struct PixelExtras {gradient:vec2<f32>,curvature:f32,height:f32,geometryAngle:f32,stripePhase:f32,directionCoherence:f32,stripeGradient:vec2<f32>,coherenceGradient:vec2<f32>}
fn decode_stripe_phase(v:u32)->f32{return f32(v&255u)/255.0;}
fn decode_direction_coherence(v:u32)->f32{return f32((v>>8u)&255u)/255.0;}
fn apply_palette_path(depth:f32){}
fn srgb_to_linear(c:vec3<f32>)->vec3<f32>{return select(pow((c+0.055)/1.055,vec3<f32>(2.4)),c/12.92,c<=vec3<f32>(0.04045));}
fn colorize_pixel(a:vec2<i32>,b:vec2<i32>,iter:f32,zx:f32,zy:f32,trap:vec4<f32>,e:PixelExtras,screen:vec2<f32>,neutral:vec2<f32>,analytic:bool)->vec4<f32>{
return vec4<f32>(.5+.4*sin(iter+zx+e.gradient.x*.01),.5+.4*sin(zy+trap.x+e.height*.02+e.stripePhase),.5+.4*sin(trap.y+e.curvature*.01+neutral.x+screen.y),1);}
@vertex fn vs_main(@builtin(vertex_index) i:u32)->@builtin(position) vec4<f32>{let xy=array<vec2<f32>,6>(vec2<f32>(-1,-1),vec2<f32>(1,-1),vec2<f32>(-1,1),vec2<f32>(-1,1),vec2<f32>(1,-1),vec2<f32>(1,1));return vec4<f32>(xy[i],0,1);}
`
function half(v){const s=v&0x8000?-1:1,e=(v>>10)&31,m=v&1023;return s*(e?2**(e-15)*(1+m/1024):2**(-14)*m/1024)}
const out=document.querySelector('#result');const log=s=>out.textContent+='\n'+s
run.onclick=async()=>{
 run.disabled=true;out.textContent='Démarrage';let d,renderer
 try{
  d=await (await navigator.gpu.requestAdapter()).requestDevice({requiredLimits:{maxSampledTexturesPerShaderStage:17}});const errors=[];d.addEventListener('uncapturederror',e=>errors.push(e.error.message))
  const projection=planExpmap({domain:{cx:'0',cy:'0',startScale:'1',endScale:'.0625'},width:32,height:18,density:2,radialDensity:3,blockSize:32})
  const manifest={projection,state:'complete',appearanceJson:'{}',total:shaderBlockCount(projection),completed:shaderBlockCount(projection)}
  const o=planExpmapOctaves(projection),stride=28,perTile=Math.ceil((o.angularSamples+2*o.halo)/stride)*Math.ceil((o.rowsPerOctave+1+2*o.halo)/stride)
  let reads=0;const source={read:async(_m,index)=>{
    reads++;const b=shaderBlockAt(projection,index),data=new Uint8Array(b.useful.width*b.useful.height*48),v=new DataView(data.buffer)
    for(let y=0;y<b.useful.height;y++)for(let x=0;x<b.useful.width;x++){
      const n=(y*b.useful.width+x)*48,gx=b.originX+x,gy=b.originY+y,t=index?Math.floor((index-1)/perTile):0
      v.setFloat32(n,Math.sin(gx*.17)+Math.cos(gy*.27)+t*.1,true);v.setFloat32(n+4,gx*.03,true);v.setFloat32(n+8,gy*.05,true)
      v.setUint32(n+12,0x38003c00,true);v.setUint32(n+16,0x3c003800,true);v.setUint32(n+20,gx+gy*256,true)
      v.setUint32(n+24,0x38003c00,true);v.setUint32(n+28,0x3c003800,true);v.setFloat32(n+32,t*.2,true);v.setFloat32(n+36,gx*.02,true)
    }return data
  }}
  const layout=d.createBindGroupLayout({entries:[]}),bindGroup=d.createBindGroup({layout,entries:[]})
  const engine={device:d,suspendForExpmapPlayback:()=>()=>{},prepareShaderExpmapColor:async()=>({code,layout,bindGroup})}
  renderer=new ShaderExpmapRenderer(engine,source,manifest,{},64*1048576)
  const full={first:0,count:13,blockStart:0,blockCount:perTile,center:true}
  const base={width:96,height:54,scale:'1',angle:0,maxSamples:16,allowUpscale:true}
  let cases=0,maxRgb=0,maxAlpha=0
  async function compare(view,ring=full){
    renderer.windowEnabled=false;const a=await renderer.renderRing(view,ring)
    renderer.windowEnabled=true;const b=await renderer.renderRing(view,ring)
    if(JSON.stringify(a.rect)!==JSON.stringify(b.rect))throw new Error('Rectangles différents')
    const av=new Uint16Array(a.data.buffer),bv=new Uint16Array(b.data.buffer)
    let rgb=0,alpha=0
    for(let i=0;i<av.length;i++){const delta=Math.abs(half(av[i])-half(bv[i]));if(!Number.isFinite(delta))throw new Error('Non fini');if(i%4===3)alpha=Math.max(alpha,delta);else rgb=Math.max(rgb,delta)}
    if(rgb>.008||alpha>.004)throw new Error(`Divergence RGB=${rgb}, alpha=${alpha}, vue=${JSON.stringify(view)}`)
    cases++;maxRgb=Math.max(maxRgb,rgb);maxAlpha=Math.max(maxAlpha,alpha)
    log(`OK ${cases} (${renderer.interpolation}/${renderer.sampleDistribution}) : ${renderer.lastRenderStats.path}, ${renderer.lastRenderStats.passes} passes, ${renderer.lastRenderStats.blocks} blocs`)
  }
  for(const interpolation of ['bilinear','nearest'])for(const distribution of ['grid','r2']){
  renderer.interpolation=interpolation;renderer.sampleDistribution=distribution
  for(const scale of ['1','.50001','.5','.49999'])await compare({...base,scale,angle:1.1})
  await compare({...base,angle:Math.PI*2-1e-5,maxSamples:256})
  await compare({...base,effects:{droste:30,kaleidoscope:0,orientation:0}})
  await compare({...base,effects:{droste:0,kaleidoscope:6,orientation:.3}})
  await compare({...base,scale:'.23',effects:{radialMode:'pingpong',radialPeriod:2,droste:0,kaleidoscope:0,orientation:0}})
  await compare({...base,effects:{radialMode:'mirror',mirrorDepth:2,droste:0,kaleidoscope:0,orientation:0}})
  await compare(base,{...full,first:1,count:2,center:false})
  await compare(base,{...full,blockStart:3,blockCount:4})
  await compare({...base,maxSamples:1})
  await compare({...base,maxSamples:4})
  }
  // Changing the mode must affect sampling without reloading the resident source.
  renderer.interpolation='bilinear';renderer.sampleDistribution='grid';const oldMode=await renderer.renderRing(base,full)
  const modeReads=reads
  renderer.interpolation='nearest';renderer.sampleDistribution='r2';const newMode=await renderer.renderRing(base,full)
  if(reads!==modeReads)throw new Error('Changer de filtre recharge la source')
  if(oldMode.data.every((v,i)=>v===newMode.data[i]))throw new Error('Le choix de filtre est sans effet')
  const repeat=await renderer.renderRing(base,full)
  if(!newMode.data.every((v,i)=>v===repeat.data[i]))throw new Error('R2 non déterministe')
  // A repeated complete view must consume only resident source slots.
  await renderer.renderRing(base,full);const before=reads;await renderer.renderRing(base,full)
  if(reads!==before)throw new Error('Relecture de blocs résidents')
  // A one-octave zoom retains overlapping regular octaves, including the reserves.
  const cached=reads;await renderer.renderRing({...base,scale:'.5'},full)
  if(reads-cached!==perTile)throw new Error(`Glissement : ${reads-cached} lectures, attendu ${perTile}`)
  // Force regular reshaping across texture layers, and N=1 plus two reserves.
  const limits={maxTextureDimension2D:64,maxTextureArrayLayers:27,maxSampledTexturesPerShaderStage:17,maxBufferSize:d.limits.maxBufferSize,maxStorageBufferBindingSize:d.limits.maxStorageBufferBindingSize}
  engine.device=new Proxy(d,{get:(target,key)=>key==='limits'?limits:typeof target[key]==='function'?target[key].bind(target):target[key]})
  await compare({...base,width:48,height:28,angle:.3,maxSamples:256})
  if(renderer.lastRenderStats.path!=='window'||renderer.lastRenderStats.passes<2)throw new Error('Pas de partition sous limite de couches')
  engine.device=d
  renderer.budgetBytes=96*54*12+shaderSourceEstimate(projection).maxBlockBytes*8+16*1048576+shaderSourceEstimate(projection).maxBlockBytes
  await renderer.renderRing(base,full)
  if(renderer.lastRenderStats.path!=='blocks')throw new Error('Repli petit budget absent')
  if(errors.length)throw new Error(errors.join('\n'))
  log(`PASS : ${cases} comparaisons ; RGB max=${maxRgb}, alpha max=${maxAlpha} ; cache, glissement, couches multiples et petit budget vérifiés.`)
 }catch(e){log('FAIL : '+(e.stack??e))}finally{renderer?.dispose();d?.destroy();run.disabled=false}
}
</script>
